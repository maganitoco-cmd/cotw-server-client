<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COTW Dashboard — Integrado</title>
<style>
:root {
  --bg: #1a0f0a;
  --panel: #2a1a10;
  --gold: #d4a843;
  --gold-dark: #8b6914;
  --text: #c8b89a;
  --text-dim: #6b5a4a;
  --red: #c0392b;
  --green: #27ae60;
  --blue: #2980b9;
  --orange: #e67e22;
  --border: #3a2a1a;
  --highlight: #3a2a10;
  --input-bg: #0f0805;
  --card-bg: #1f120a;
  --accent-green: #2ecc71;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Georgia', serif;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  font-size: 12px;
}
/* HEADER */
#header {
  background: linear-gradient(180deg, #3a2010, #2a1508);
  border-bottom: 2px solid var(--gold-dark);
  padding: 4px 10px;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
  flex-wrap: wrap;
  min-height: 36px;
}
#header h1 { color: var(--gold); font-size: 14px; white-space: nowrap; }
#header input, #header select {
  background: var(--input-bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 2px 6px;
  border-radius: 3px;
  font-family: inherit;
  font-size: 11px;
}
#header button {
  background: var(--gold-dark);
  border: 1px solid var(--border);
  color: #fff;
  padding: 3px 8px;
  border-radius: 3px;
  font-family: inherit;
  font-size: 11px;
  cursor: pointer;
  font-weight: bold;
  white-space: nowrap;
}
#header button:hover { background: var(--gold); }
#main { display: flex; flex: 1; overflow: hidden; }
/* LEFT SIDEBAR */
#left-sidebar {
  width: 200px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
}
#left-sidebar .sidebar-title {
  color: var(--gold);
  font-size: 11px;
  padding: 6px 8px 3px;
  border-bottom: 1px solid var(--border);
  font-weight: bold;
}
#left-sidebar .quick-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px;
  padding: 4px 6px;
  border-bottom: 1px solid var(--border);
}
#left-sidebar .quick-actions button {
  background: var(--input-bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 3px 4px;
  border-radius: 3px;
  cursor: pointer;
  font-family: inherit;
  font-size: 10px;
}
#left-sidebar .quick-actions button:hover { background: var(--highlight); color: var(--gold); }
.nav-item {
  display: block;
  width: 100%;
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--border);
  color: var(--text);
  text-align: left;
  padding: 5px 8px 5px 14px;
  cursor: pointer;
  font-family: inherit;
  font-size: 11px;
}
.nav-item:hover { background: var(--highlight); color: var(--gold); }
.nav-item.active { background: var(--gold-dark); color: #fff; }
.nav-item .nav-badge { float: right; font-size: 9px; color: var(--text-dim); }
/* CENTER DASHBOARD */
#center {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.dash-section {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 8px;
}
.dash-section h2 {
  color: var(--gold);
  font-size: 13px;
  margin-bottom: 6px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 4px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.dash-section h2 .badge {
  font-size: 10px;
  color: var(--text-dim);
  font-weight: normal;
}
/* RESOURCE BARS */
.res-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 4px;
}
.res-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 4px 6px;
}
.res-card .res-name { font-size: 10px; color: var(--text-dim); }
.res-card .res-val { font-size: 14px; font-weight: bold; }
.res-card .res-bar { height: 4px; background: #2a1508; border-radius: 2px; margin-top: 2px; overflow: hidden; }
.res-card .res-bar-fill { height: 100%; border-radius: 2px; transition: width 0.5s; }
/* BUILDING CARDS */
.building-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 5px;
}
.dash-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 6px;
  transition: border-color 0.15s;
}
.dash-card:hover { border-color: var(--gold-dark); }
.dash-card .card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 3px;
}
.dash-card .card-title { font-weight: bold; font-size: 12px; }
.dash-card .card-level { color: var(--gold); font-size: 11px; }
.dash-card .card-stats { font-size: 10px; color: var(--text-dim); margin-bottom: 4px; }
.dash-card .card-actions {
  display: flex;
  gap: 3px;
  flex-wrap: wrap;
  margin-top: 3px;
}
.dash-card .card-timer {
  font-size: 10px;
  color: var(--orange);
  padding: 2px 0;
}
/* TROOP GRID */
.troop-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 4px;
}
/* HERO CARD */
.hero-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 8px;
  display: flex;
  gap: 10px;
  align-items: start;
}
.hero-card .hero-info { flex: 1; }
.hero-card .hero-stats { font-size: 10px; }
.hero-card .hero-skills { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 2px; }
.hero-card .skill-pill {
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1px 6px;
  font-size: 9px;
}
/* MARCH CARD */
.march-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 4px;
}
/* BUTTONS */
.btn {
  padding: 3px 10px;
  border-radius: 3px;
  border: 1px solid var(--border);
  font-family: inherit;
  font-size: 11px;
  cursor: pointer;
  font-weight: bold;
  transition: background 0.15s;
}
.btn-sm { padding: 2px 6px; font-size: 10px; }
.btn-gold { background: var(--gold-dark); color: #fff; }
.btn-gold:hover { background: var(--gold); }
.btn-green { background: var(--green); color: #fff; }
.btn-green:hover { background: var(--accent-green); }
.btn-red { background: var(--red); color: #fff; }
.btn-red:hover { background: #e74c3c; }
.btn-blue { background: var(--blue); color: #fff; }
.btn-blue:hover { background: #3498db; }
.btn-dim { background: var(--text-dim); color: #fff; }
.btn-dim:hover { background: #7a6a5a; }
.btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
.btn-outline:hover { background: var(--highlight); color: var(--gold); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
/* RIGHT SIDEBAR */
#right-sidebar {
  width: 300px;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  border-left: 1px solid var(--border);
}
#timers-panel {
  background: var(--panel);
  padding: 6px;
  max-height: 40%;
  overflow-y: auto;
  border-bottom: 1px solid var(--border);
}
#timers-panel h3 { color: var(--gold); font-size: 12px; margin-bottom: 4px; }
#response-panel {
  background: var(--panel);
  padding: 6px;
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}
#response-panel h3 { color: var(--gold); font-size: 12px; margin-bottom: 3px; flex-shrink: 0; }
#response-panel pre {
  background: #0a0502;
  padding: 6px;
  border: 1px solid var(--border);
  border-radius: 3px;
  font-size: 10px;
  overflow: auto;
  white-space: pre-wrap;
  word-break: break-all;
  flex: 1;
}
/* WATCHERS IN SIDEBAR */
.watcher-item {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 5px;
  margin: 3px 0;
  font-size: 10px;
}
.watcher-item .bar { height: 3px; background: #2a1508; border-radius: 2px; margin: 3px 0; overflow: hidden; }
.watcher-item .bar-fill { height: 100%; background: var(--gold); transition: width 1s linear; }
.countdown { color: var(--gold); font-family: 'Courier New', monospace; font-size: 12px; }
.status-Departure { color: var(--blue); }
.status-Return { color: var(--orange); }
.status-Ended { color: var(--text-dim); }
.status-Gather { color: var(--green); }
.status-Camping { color: var(--text-dim); }
.status-Ruins { color: var(--gold); }
.status-Reinforcements { color: var(--blue); }
/* MODAL */
#modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  z-index: 1000;
  justify-content: center;
  align-items: center;
}
#modal-overlay.open { display: flex; }
#modal-box {
  background: var(--panel);
  border: 2px solid var(--gold-dark);
  border-radius: 6px;
  padding: 14px;
  max-width: 480px;
  width: 90%;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 0 30px rgba(0,0,0,0.5);
}
#modal-box h3 { color: var(--gold); font-size: 14px; margin-bottom: 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
#modal-box .form-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 5px;
  flex-wrap: wrap;
}
#modal-box .form-row label { min-width: 80px; color: var(--text); font-size: 11px; }
#modal-box .form-row input, #modal-box .form-row select {
  flex: 1;
  min-width: 100px;
  background: var(--input-bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 3px 6px;
  border-radius: 3px;
  font-family: 'Courier New', monospace;
  font-size: 11px;
}
#modal-box .form-actions {
  display: flex;
  gap: 6px;
  margin-top: 10px;
  flex-wrap: wrap;
}
#modal-cost {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 8px;
  margin: 6px 0;
  font-size: 11px;
}
/* STATS PANEL */
#stats-panel {
  height: 110px;
  background: var(--panel);
  border-top: 2px solid var(--gold-dark);
  overflow-y: auto;
  flex-shrink: 0;
}
#stats-panel h3 {
  color: var(--gold);
  font-size: 11px;
  padding: 2px 10px;
  position: sticky;
  top: 0;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
}
.stats-table { width: 100%; font-size: 9px; border-collapse: collapse; }
.stats-table th { background: #2a1508; color: var(--gold); text-align: left; padding: 2px 6px; position: sticky; top: 20px; }
.stats-table td { padding: 2px 6px; border-bottom: 1px solid var(--border); }
.stats-table tr:hover td { background: var(--highlight); }
.slow { color: var(--red); }
.medium { color: var(--orange); }
.fast { color: var(--green); }
#status-bar {
  background: #0a0502;
  border-top: 1px solid var(--border);
  padding: 2px 10px;
  font-size: 10px;
  color: var(--text-dim);
  flex-shrink: 0;
}
#status-bar .ok { color: var(--green); }
#status-bar .err { color: var(--red); }
.spinner { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--text-dim); border-top: 2px solid var(--gold); border-radius: 50%; animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
/* Responsive */
@media (max-width: 900px) {
  #left-sidebar { width: 150px; }
  #right-sidebar { width: 250px; }
  .building-grid { grid-template-columns: 1fr; }
  .res-grid { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 650px) {
  #left-sidebar { display: none; }
  #right-sidebar { display: none; }
}
</style>
</head>
<body>
<div id="header">

<script>
// ===================== CONFIG =====================
const PROXY = window.location.origin + '/api/';
let userId = '', deviceId = '', callCount = 0, totalElapsed = 0;
let lastUserData = null;
let countdownTimers = [];
let marchPollIntervals = {};
let modalState = null; // {cat, action, params, costParams}

// ===================== BUILDING NAMES =====================
const BUILDING_NAMES = {
  1001: '🏰 Castillo',
  1002: '🏛️ Cuartel',
  1003: '🏥 Hospital',
  1004: '🔨 Forja',
  1005: '📜 Academia',
  1006: '🔧 Taller',
  1007: '🏪 Mercado',
  1008: '📦 Almacén',
  2001: '🌾 Granja',
  2002: '🪵 Aserradero',
  2003: '🪨 Cantera',
  2004: '⛏️ Mina',
  2005: '🏦 Almacén',
  2006: '🏗️ Torre Vigía',
  2015: '⚔️ Campo Entrenamiento'
};

function getBuildingName(id) {
  return BUILDING_NAMES[parseInt(id)] || `Edificio #${id}`;
}

function getBuildingLevelAtNode(node, userBuildings) {
  if (!userBuildings || !userBuildings.length) return null;
  return userBuildings.find(b => String(b.Node) === String(node)) || null;
}

function getRequisitesHtml(reqs, userBuildings) {
  if (!reqs || !reqs.length) return '';
  const buildingReqs = reqs.filter(r => String(r.Type).toLowerCase() === 'building');
  if (!buildingReqs.length) return '';
  const items = buildingReqs.map(r => {
    const name = getBuildingName(r.id);
    const lv = r.Level;
    const met = userBuildings ? userBuildings.some(ub => String(ub.idBuilding) === String(r.id) && parseInt(ub.Level) >= parseInt(r.Level)) : false;
    const icon = met ? '✅' : '❌';
    const cls = met ? '' : 'color:var(--red)';
    return `<span style="${cls}">${icon} ${name} Lv.${lv}</span>`;
  });
  return `<div style="margin-top:6px;padding:4px 6px;background:#1a0f0a;border:1px solid var(--border);border-radius:3px;font-size:10px">
    <span style="color:var(--orange)">⚠️ Requisitos:</span> ${items.join(', ')}
  </div>`;
}

// ===================== ACTION DEFINITIONS =====================
const ACTIONS = {
  "Usuario": {
    icon: "👤",
    actions: [
      {name:"login", servlet:"USER", params:[], desc:"Iniciar sesión con deviceId"},
      {name:"reset", servlet:"USER", params:[], desc:"Reiniciar cuenta"},
      {name:"dailyReward", servlet:"USER", params:[], desc:"Recompensa diaria"},
      {name:"getDictionaries", servlet:"USER", params:[], desc:"Obtener diccionarios"},
      {name:"getLanguage", servlet:"USER", params:[], desc:"Idioma actual"},
      {name:"changeLanguage", servlet:"USER", params:[{key:"Language",label:"Idioma",default:"es",help:"es, en, etc."}], desc:"Cambiar idioma"},
      {name:"getUser", servlet:"USER", params:[{key:"UserID",label:"UserID",default:"",help:"ID de usuario a consultar"}], desc:"Obtener datos de usuario"},
      {name:"getUserName", servlet:"USER", params:[{key:"UserID",label:"UserID",default:"",help:"ID de usuario"}], desc:"Obtener nombre de usuario"},
      {name:"getIn", servlet:"USER", params:[], desc:"Verificar si está dentro"},
      {name:"loginJustUser", servlet:"USER", params:[], desc:"Login rápido solo usuario"},
      {name:"pushBind", servlet:"USER", params:[{key:"idPush",label:"Push ID",default:"test_push",help:"ID de notificación push"}], desc:"Vincular push"},
      {name:"toggleNotification", servlet:"USER", params:[{key:"Notification",label:"Notificaciones",default:"true",help:"true/false"}], desc:"Activar/desactivar notif."},
      {name:"fbBind", servlet:"USER", params:[{key:"FBid",label:"Facebook ID",default:"test_fb",help:"ID de Facebook"},{key:"Email",label:"Email",default:"test@test.com",help:"Correo electrónico"}], desc:"Vincular Facebook"}
    ]
  },
  "Edificios Construir": {
    icon: "🏗️",
    actions: [
      {name:"construct", servlet:"BUILDINGS", params:[{key:"idBuilding",label:"idBuilding",default:"1001",help:"ID del edificio a construir"},{key:"Node",label:"Node",default:"1",help:"Slot de construcción (1-5)"}], costAction:"goldCostConstruct", desc:"Construir edificio"},
      {name:"GOLDconstruct", servlet:"BUILDINGS", params:[{key:"idBuilding",label:"idBuilding",default:"1001"},{key:"Node",label:"Node",default:"1"}], costAction:"goldCostConstruct", desc:"Construir con oro"},
      {name:"levelUpB", servlet:"BUILDINGS", params:[{key:"Node",label:"Node",default:"1",help:"Slot del edificio a mejorar"}], costAction:"goldCostBuild", desc:"Mejorar edificio"},
      {name:"GOLDlevelUpB", servlet:"BUILDINGS", params:[{key:"Node",label:"Node",default:"1"}], costAction:"goldCostBuild", desc:"Mejorar con oro"},
      {name:"demolish", servlet:"BUILDINGS", params:[{key:"Node",label:"Node",default:"1",help:"Slot a demoler"}], desc:"Demoler edificio"},

// ===================== INIT =====================
function loadState() {
  deviceId = localStorage.getItem('cotw_deviceId') || document.getElementById('deviceId').value;
  document.getElementById('deviceId').value = deviceId;
  userId = localStorage.getItem('cotw_userId') || '';
}
function saveState() {
  localStorage.setItem('cotw_deviceId', deviceId);
  if (userId) localStorage.setItem('cotw_userId', userId);
}
loadState();

// ===================== SCROLL NAV =====================
function scrollToSection(id) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelector(`.nav-item[onclick*="${id}"]`)?.classList.add('active');
  const el = document.getElementById('section-' + id);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function renderDashboard(data) {
  const u = data.User || data;
  const p = u.Player || {};
  const buildings = u.Buildings || [];
  const troops = u.Troops || [];
  const hero = u.Hero || {};
  const researchs = u.Researchs || [];
  const constructs = u.Constructs || [];
  const vip = u.VIP || {};
  const res = u.Resources || {};
  const marches = u.Marches || [];
  const warlords = u.Warlords || [];
  const alliance = u.Alliance || {};
  const bp = (data.BuildingProgressions || lastUserData?.BuildingProgressions || []);
  const activeConstructions = (data.Constructs || constructs || []);

  // Update connection status
  if (p.UserName) {
    document.getElementById('conn-status').textContent = '🟢';
    document.getElementById('conn-status').style.color = 'var(--green)';
    document.getElementById('dash-summary').innerHTML = `<span style="color:var(--green)">${p.UserName}</span> Lv.${hero.Level || 1} | 💰${(u.Gold?.Quantity||0).toLocaleString()}`;
  }

  document.getElementById('dash-placeholder').style.display = 'none';
  document.getElementById('dash-content').style.display = 'flex';
  document.getElementById('dash-content').style.flexDirection = 'column';
  document.getElementById('dash-content').style.gap = '8px';

  // Update active construct watchers from data
  if (activeConstructions.length) {
    updateConstructsFromData(activeConstructions);
  }

  // Update march watchers
  if (marches.length) {
    updateMarchesFromData(marches);
  }

  let html = '';

  // ========== SECCIÓN RECURSOS ==========
  html += `<div class="dash-section" id="section-recursos">
    <h2>📊 Recursos <span class="badge">💰 ${(u.Gold?.Quantity||0).toLocaleString()} Gold</span></h2>
    <div class="res-grid">`;
  const resNames = ['Food','Wood','Stone','Ore','Ecto'];
  const resIcons = {'Food':'🍗','Wood':'🪵','Stone':'🪨','Ore':'⛏️','Ecto':'🔮'};
  const resColors = {'Food':'#27ae60','Wood':'#8b6914','Stone':'#6b5a4a','Ore':'#e67e22','Ecto':'#9b59b6'};
  // Gold card
  html += `<div class="res-card">
    <div class="res-name">💰 Gold</div>
    <div class="res-val" style="color:var(--gold)">${(u.Gold?.Quantity||0).toLocaleString()}</div>
    <div class="res-bar"><div class="res-bar-fill" style="width:100%;background:var(--gold)"></div></div>
  </div>`;
  resNames.forEach(r => {
    const d = res[r] || {};
    const val = d.Quantity || 0;
    const cap = d.Cap || val * 2 || 1000000;
    const pct = Math.min(100, (val / cap) * 100);
    html += `<div class="res-card">
      <div class="res-name">${resIcons[r] || ''} ${r}</div>
      <div class="res-val" style="color:${resColors[r] || 'var(--text)'}">${val.toLocaleString()}</div>
      <div class="res-bar"><div class="res-bar-fill" style="width:${pct}%;background:${resColors[r] || 'var(--text)'}"></div></div>
    </div>`;
  });
  html += `<div class="res-card">
    <div class="res-name">💠 DarkRunes</div>
    <div class="res-val" style="color:#9b59b6">${(u.DarkRunes?.Quantity||0).toLocaleString()}</div>
  </div>`;
  html += `</div></div>`;

  // ========== SECCIÓN EDIFICIOS ==========
  html += `<div class="dash-section" id="section-edificios">
    <h2>🏗️ Edificios <span class="badge">${buildings.length} construidos</span></h2>
    <div class="building-grid">`;
  buildings.forEach(b => {
    const name = getBuildingName(b.idBuilding);
    const currentProg = bp.find(p => String(p.idBuilding) === String(b.idBuilding) && String(p.Level) === String(b.Level));
    const nextProg = bp.find(p => String(p.idBuilding) === String(b.idBuilding) && String(p.Level) === String(parseInt(b.Level)+1));
    const nextTime = nextProg ? nextProg.Time : null;
    const nextCosts = nextProg ? nextProg.Cost : null;
    const nextReqs = nextProg ? nextProg.Requisites : null;
    // Check if this building has an active construct
    const activeCons = activeConstructions.filter(c => String(c.Location || c.Node) === String(b.Node) && c.Type === 'Construct');
    const hasActive = activeCons.length > 0;

    html += `<div class="dash-card">
      <div class="card-header">
        <span class="card-title">${name}</span>
        <span class="card-level">Lv.${b.Level} ${b.Node ? `[${b.Node}]` : ''}</span>
      </div>
      <div class="card-stats">⚔️ Poder: ${(b.Power || 0).toLocaleString()} ${b.Hp ? '| ❤️ '+b.Hp : ''}</div>`;
    if (hasActive) {
      html += `<div class="card-timer">⏱️ Construyendo...</div>`;
    }
    if (!hasActive) {
      html += `<div class="card-actions">
        <button class="btn btn-gold btn-sm" onclick="buildingLevelUp('${b.Node}','${b.idBuilding}','${b.Level}')">⬆️ Subir Nivel</button>
        <button class="btn btn-red btn-sm" onclick="showActionModal('Edificios Construir','demolish',{Node:'${b.Node}'})">💥 Demoler</button>
        ${parseInt(b.idBuilding) === 2015 ? `<button class="btn btn-blue btn-sm" onclick="showActionModal('Edificios Entrenar','train',{idBuilding:'${b.idBuilding}'})">⚔️ Entrenar</button>` : ''}
        ${parseInt(b.idBuilding) === 1004 ? `<button class="btn btn-gold btn-sm" onclick="showActionModal('Edificios Forjar','forge')">🔨 Forjar</button>` : ''}
        ${parseInt(b.idBuilding) === 1005 ? `<button class="btn btn-green btn-sm" onclick="showActionModal('Edificios Investigar','research')">📜 Investigar</button>` : ''}
        ${Array.isArray(b.CanCollect) && b.CanCollect.length ? `<button class="btn btn-green btn-sm" onclick="quickAction('BUILDINGS','collect',{Node:'${b.Node}'})">📦 Recolectar</button>` : ''}
      </div>`;
    }
    if (nextTime) {
      html += `<div style="margin-top:3px;font-size:9px;color:var(--text-dim)">
        ⏱️ Sig. nivel: ${Math.ceil(nextTime/60)}m`;
      if (nextCosts && nextCosts.length) {
        const costParts = nextCosts.filter(c => c.Type === 'Resources').map(c => `${c.Name}: ${(c.Quantity||0).toLocaleString()}`);
        if (costParts.length) html += ` | 📦 ${costParts.join(' | ')}`;
      }
      html += `</div>`;
    }
    if (nextReqs) html += getRequisitesHtml(nextReqs, buildings);
    if (!nextProg) html += `<div style="margin-top:3px;font-size:10px;color:var(--gold-dark)">🏆 Nivel máximo</div>`;
    // Current level rewards
    if (currentProg && currentProg.Rewards && currentProg.Rewards.length) {
      html += `<div style="margin-top:2px;font-size:9px;color:var(--green)">🏅 Recomp: ${currentProg.Rewards.map(r => `${r.Type}: ${r.Quantity || r.Hp || ''}`).join(', ')}</div>`;
    }
    html += `</div>`;
  });
  html += `</div>
    <div style="margin-top:4px;display:flex;gap:4px;flex-wrap:wrap">
      <button class="btn btn-gold btn-sm" onclick="showActionModal('Edificios Construir','construct')">🏗️ Construir Nuevo</button>

  // ========== SECCIÓN TROPAS ==========
  html += `<div class="dash-section" id="section-tropas">
    <h2>⚔️ Tropas <span class="badge">${troops.length ? troops.reduce((s,t) => s + (t.Active||0) + (t.Wounded||0) + (t.Dead||0), 0).toLocaleString() : 0} total</span></h2>

  if (troops.length) {

    troopTypes.forEach(type => {

// ========== BUILDING LEVEL UP (SPECIAL FLOW) ==========
async function buildingLevelUp(node, idBuilding, currentLevel) {
  const bp = (lastUserData && lastUserData.BuildingProgressions) || [];
  const nextProg = bp.find(p => String(p.idBuilding) === String(idBuilding) && String(p.Level) === String(parseInt(currentLevel)+1));
  
  // Show modal with cost
  const modalBody = document.getElementById('modal-body');
  const modalTitle = document.getElementById('modal-title');
  modalTitle.innerHTML = `⬆️ Subir Nivel — ${getBuildingName(idBuilding)} [Node ${node}]`;
  
  let html = `<div class="form-row">
    <label>Node</label>

// ========== MODAL SYSTEM ==========
function showActionModal(catName, actionName, presetParams) {
  const cat = ACTIONS[catName];
  const action = cat.actions.find(a => a.name === actionName);
  if (!action) return;

  const modalTitle = document.getElementById('modal-title');
  const modalBody = document.getElementById('modal-body');
  const modalActions = document.getElementById('modal-actions');
  
  modalTitle.innerHTML = `${cat.icon || '📋'} ${actionName} <span style="font-size:10px;font-weight:normal;color:var(--text-dim)">${action.servlet} — ${action.desc || ''}</span>`;

  let html = '';
  // Action-specific params
  action.params.filter(p => p.key !== 'action').forEach(p => {
    const presetVal = (presetParams && presetParams[p.key]) || p.value || p.default || '';
    html += `<div class="form-row">
      <label>${p.label}</label>
      <input type="text" id="m-${p.key}" value="${presetVal}" placeholder="${p.help || ''}">
    </div>`;
  });

  // Show requisites for building actions
  const BUILDING_REQ = ['construct', 'levelUpB', 'train', 'research'];
  if (BUILDING_REQ.includes(actionName)) {
    const bp = (lastUserData && lastUserData.BuildingProgressions) || [];
    const userBuildings = (lastUserData && lastUserData.User && lastUserData.User.Buildings) || [];
    let reqs = null;
    if (actionName === 'construct') {
      const idB = presetParams?.idBuilding || action.params.find(p => p.key === 'idBuilding')?.default || '1001';
      const prog = bp.find(b => String(b.idBuilding) === String(idB) && String(b.Level) === '1');
      if (prog) reqs = prog.Requisites || null;
    } else if (actionName === 'train') {
      const idB = presetParams?.idBuilding || action.params.find(p => p.key === 'idBuilding')?.default || '2015';
      const lv = presetParams?.Level || action.params.find(p => p.key === 'Level')?.default || '1';
      const prog = bp.find(b => String(b.idBuilding) === String(idB) && String(b.Level) === String(lv));
      if (prog) reqs = prog.Requisites || null;
    } else if (actionName === 'research') {
      const idR = presetParams?.idResearch || action.params.find(p => p.key === 'idResearch')?.default || '1';
      const rp = (lastUserData && (lastUserData.ResearchProgressions || lastUserData.SkillProgressions || []));
      if (rp.length) {
        const found = rp.find(r => String(r.idResearch || r.idSkill || r._id) === String(idR));
        if (found) reqs = found.Requisites || null;
      }
      if (!reqs) {
        const prog = bp.find(b => String(b.idBuilding) === '1005' && String(b.Level) === String(idR));
        if (prog) reqs = prog.Requisites || null;
      }
    }
    html += `<div id="modal-requisites">` + getRequisitesHtml(reqs, userBuildings) + `</div>`;
  }

  // Cost preview + execute buttons
  const hasCost = hasCostPreview(action);
  html += `<div class="form-actions">`;
  if (hasCost) {
    html += `<button class="btn btn-blue" onclick="previewCostFromModal('${catName}','${actionName}',getModalParams(),'${action.costAction}')">💰 Previsualizar Costo</button>`;
  }
  html += `<button class="btn btn-green" onclick="executeFromModal('${catName}','${actionName}',getModalParams())">✅ Ejecutar</button>`;
  if (hasCost) {
    // Show gold version if available
    const goldAction = cat.actions.find(a => a.name === 'GOLD' + actionName.charAt(0).toUpperCase() + actionName.slice(1) ||
      (actionName === 'construct' ? cat.actions.find(a => a.name === 'GOLDconstruct') : null));
    const goldName = actionName === 'construct' ? 'GOLDconstruct' : actionName === 'levelUpB' ? 'GOLDlevelUpB' : actionName === 'train' ? 'GOLDtrain' : actionName === 'research' ? 'GOLDresearch' : null;
    if (goldName && cat.actions.find(a => a.name === goldName)) {
      html += `<button class="btn btn-gold" onclick="executeFromModal('${catName}','${goldName}',getModalParams())">💰 Con Oro</button>`;
    }
  }
  html += `<button class="btn btn-dim" onclick="closeModal()">✖️ Cancelar</button>
  </div>`;

  // Cost display area
  html += `<div id="modal-cost" style="display:none"></div>`;

  modalBody.innerHTML = html;
  modalState = { cat: catName, action: actionName, params: presetParams || {} };
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  modalState = null;
}

function getModalParams() {
  const params = {};
  document.querySelectorAll('#modal-body [id^="m-"]').forEach(el => {
    const key = el.id.replace('m-', '');
    if (el.value) params[key] = el.value;
  });
  return params;
}

// ========== COST PREVIEW IN MODAL ==========
async function previewCostFromModal(catName, actionName, formParams, costAction) {
  const costDiv = document.getElementById('modal-cost');
  costDiv.style.display = 'block';
  costDiv.innerHTML = '<p><span class="spinner"></span> Calculando costo...</p>';

  const url = buildUrl('BUILDINGS', { ...formParams, action: costAction, deviceId, idUser: userId });
  document.getElementById('resp-time').innerHTML = '<span class="spinner"></span> Calculando costo...';

  try {
    const resp = await fetch(url);
    const data = await resp.json();
    const elapsed = data._proxy_elapsed_ms || 0;
    addStatsEntry(`BUILDINGS?action=${costAction}`, resp.status, elapsed, data);

    if (data.result === 1) {
      const goldCost = data.GoldCost || data.goldCost || data.Gold || '?';
      let costHtml = `<h4>💰 Costo: <span style="color:var(--gold);font-size:16px">${JSON.stringify(goldCost)}</span></h4>`;
      
      // Also look up from BuildingProgressions
      const bp = (lastUserData && lastUserData.BuildingProgressions) || [];
      const idBuilding = formParams.idBuilding;
      const level = formParams.Level || '1';
      let resourceCosts = null;
      if (bp.length > 0 && idBuilding) {
        let prog = bp.find(b => String(b.idBuilding) === String(idBuilding) && String(b.Level) === String(level));
        if (!prog) prog = bp.find(b => String(b.idBuilding) === String(idBuilding));
        if (prog && prog.Cost) resourceCosts = prog.Cost;
      }
      if (resourceCosts && Array.isArray(resourceCosts)) {
        const resParts = resourceCosts.filter(c => c.Type === 'Resources').map(c => `${c.Name || c.Type}: ${(c.Quantity||0).toLocaleString()}`);
        if (resParts.length) costHtml += `<p>📦 ${resParts.join(' | ')}</p>`;
      }
      costHtml += `<pre style="background:#0a0502;padding:4px;border:1px solid var(--border);font-size:9px;margin-top:4px">${JSON.stringify(data, null, 2)}</pre>`;
      costDiv.innerHTML = costHtml;
    } else {
      costDiv.innerHTML = `<p style="color:var(--red)">❌ Error: ${data.Message || data.message || 'Desconocido'}</p>`;
    }
    showResponse(data, elapsed, resp.status);
  } catch (e) {
    costDiv.innerHTML = `<p style="color:var(--red)">❌ ${e.message}</p>`;
    document.getElementById('resp-time').innerHTML = `❌ ${e.message}`;
  }
}

// ========== EXECUTE FROM MODAL ==========
async function executeFromModal(catName, actionName, formParams) {
  const cat = ACTIONS[catName];
  const action = cat.actions.find(a => a.name === actionName);
  if (!action) return;

  const params = { ...formParams, action: actionName, deviceId, idUser: userId };
  const url = buildUrl(action.servlet, params);

  document.getElementById('resp-time').innerHTML = '<span class="spinner"></span> Ejecutando...';

  try {
    const resp = await fetch(url);
    const data = await resp.json();
    const elapsed = data._proxy_elapsed_ms || 0;
    addStatsEntry(`${action.servlet}?action=${actionName}`, resp.status, elapsed, data);
    showResponse(data, elapsed, resp.status);

    closeModal();

    // Check for idConstruct → add watcher
    const constructId = data.idConstruct || (data.Construct && (data.Construct._id?.$oid || data.Construct._id));
    if (constructId) {
      addConstructWatcher(constructId, data);
      setStatus(`✅ Construcción iniciada: ${constructId}`, 'ok');
    }

    // Check for march
    const marchData = data.March || data.march;
    if (marchData) {
      const marchId = marchData._id?.$oid || marchData._id || '';
      if (marchId) {
        addMarchWatcher(marchData);
        startMarchAutoPoll(marchId);
        setStatus(`🚶 Marcha creada: ${marchId}`, 'ok');
      }
    }

    // Refresh dashboard if user data returned
    if (data.result === 1 && data.User) {
      lastUserData = data;
      renderDashboard(data);
    } else {
      // Still refresh to get latest state
      setTimeout(refreshDashboard, 1000);
    }
  } catch (e) {
    document.getElementById('resp-time').innerHTML = `❌ ${e.message}`;
    setStatus(`❌ Error: ${e.message}`, 'err');
  }
}

// ========== QUICK ACTION (no modal) ==========
async function quickAction(servlet, action, extraParams) {

}

// ========== BUILD URL ==========
function buildUrl(servlet, params) {
  let url = PROXY + servlet;
  let sep = '?';
  Object.keys(params).forEach(k => {
    if (params[k]) {
      url += sep + encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
      sep = '&';
    }
  });
  return url;
}

// ========== SHOW RESPONSE ==========
function showResponse(data, elapsed, status) {
  const cls = elapsed > 5000 ? 'slow' : elapsed > 2000 ? 'medium' : 'fast';
  document.getElementById('resp-time').innerHTML = `⏱️ <span class="${cls}">${elapsed}ms</span> | HTTP ${status} | ${JSON.stringify(data).length} bytes`;
  document.getElementById('resp-body').textContent = JSON.stringify(data, null, 2);
}

// ========== STATS ==========
function addStatsEntry(endpoint, status, elapsed, data) {
  callCount++;
  totalElapsed += elapsed;
  const cls = elapsed > 5000 ? 'slow' : elapsed > 2000 ? 'medium' : 'fast';
  document.getElementById('stats-body').insertAdjacentHTML('afterbegin', `
    <tr>
      <td>${callCount}</td>
      <td>${new Date().toLocaleTimeString()}</td>
      <td>${endpoint}</td>
      <td>${status}</td>
      <td class="${cls}">${elapsed}</td>
      <td>${(JSON.stringify(data).length/1024).toFixed(1)} KB</td>
    </tr>
  `);
  document.getElementById('stats-count').textContent = callCount;
  document.getElementById('stats-avg').textContent = ` | Prom: ${(totalElapsed/callCount).toFixed(0)}ms`;
}

// ========== CONSTRUCT WATCHER ==========
function addConstructWatcher(id, data) {
  const container = document.getElementById('construct-list');
  const watcher = document.getElementById('construct-watcher');
  watcher.style.display = 'block';
  document.getElementById('timers-empty').style.display = 'none';

  const c = data.Construct || data.construct || {};
  const endDate = c.EndDate?.$date || c.EndDate;
  const startDate = c.StartDate?.$date || c.StartDate;
  const endMs = endDate ? new Date(endDate).getTime() : (Date.now() + 3600000);
  const startMs = startDate ? new Date(startDate).getTime() : Date.now();
  const totalDuration = Math.max(1, endMs - startMs);
  const remaining = Math.max(0, endMs - Date.now());
  const pct = totalDuration > 1 ? Math.min(100, ((1 - remaining / totalDuration) * 100)) : 0;

  // Don't add duplicate
  if (document.querySelector(`#construct-list .watcher-item[data-id="${id}"]`)) return;

  const item = document.createElement('div');
  item.className = 'watcher-item';
  item.dataset.id = id;
  item.dataset.end = endMs;
  item.dataset.total = totalDuration;
  item.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span><b>${c.Type || 'Construcción'}</b> ${c.idStuff || ''} | Node ${c.Location || (data.Node || '?')}</span>
      <span>
        <button class="btn btn-blue" style="font-size:8px;padding:1px 5px" onclick="checkConstruct('${id}')">⏱️</button>
        <button class="btn btn-gold" style="font-size:8px;padding:1px 5px" onclick="speedUpConstruct('${id}')">💰</button>
      </span>
    </div>
    <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
    <div style="font-size:9px">⏱️ <span class="countdown" data-end="${endMs}">${formatTime(Math.ceil(remaining/1000))}</span></div>
  `;
  container.appendChild(item);
  startWatcherCountdowns();
}

// ========== MARCH AUTO-POLL ==========
function startMarchAutoPoll(marchId) {
  if (marchPollIntervals[marchId]) {
    clearInterval(marchPollIntervals[marchId]);
  }
  const poll = async () => {
    try {
      const url = `${PROXY}WORLDMAP?action=getMarch&idMarch=${marchId}&deviceId=${deviceId}&idUser=${userId}`;
      const resp = await fetch(url);
      const data = await resp.json();
      if (data && data.result === 1) {
        const march = data.March || data.march || {};
        const status = march.Status || '';
        const item = document.querySelector(`#march-list .watcher-item[data-id="${marchId}"]`);
        if (item) {
          const endDate = march.EndDate?.$date || march.EndDate;
          const startDate = march.StartDate?.$date || march.StartDate;
          if (endDate) {
            const endMs = new Date(endDate).getTime();
            const startMs = startDate ? new Date(startDate).getTime() : Date.now();
            item.dataset.end = endMs;
            item.dataset.total = Math.max(1, endMs - startMs);
            startWatcherCountdowns();
          }
          const statusSpan = item.querySelector('.march-status-text');
          if (statusSpan) {
            const oldClasses = Array.from(statusSpan.classList).filter(c => c.startsWith('status-'));
            oldClasses.forEach(c => statusSpan.classList.remove(c));
            statusSpan.classList.add(`status-${status}`);
            statusSpan.textContent = status;
          }
          if (status === 'Ended') {
            clearInterval(marchPollIntervals[marchId]);
            delete marchPollIntervals[marchId];
            const bar = item.querySelector('.bar-fill');
            if (bar) bar.style.width = '100%';
            const cd = item.querySelector('.countdown');
            if (cd) cd.textContent = '✅ Finalizada';
            setStatus(`🚶 Marcha ${marchId} ha finalizado`, 'ok');
          }
        }
      }
    } catch (e) {}
  };
  poll();
  marchPollIntervals[marchId] = setInterval(poll, 5000);
}

// ========== COUNTDOWN TIMERS ==========
function formatTime(secs) {
  if (secs <= 0) return '✅ Completado';
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  const s = secs % 60;
  if (h > 0) return `${h}h ${m}m ${s}s`;
  if (m > 0) return `${m}m ${s}s`;
  return `${s}s`;
}

function startWatcherCountdowns() {
  countdownTimers.forEach(t => clearInterval(t));
  countdownTimers = [];
  document.querySelectorAll('.watcher-item .countdown').forEach(el => {
    const end = parseInt(el.dataset.end);
    if (!end) return;
    const id = setInterval(() => {
      const remaining = Math.max(0, end - Date.now());
      const secs = Math.ceil(remaining / 1000);
      el.textContent = formatTime(secs);
      const parent = el.closest('.watcher-item');
      if (parent) {
        const bar = parent.querySelector('.bar-fill');
        if (bar) {
          const total = parseInt(parent.dataset.total) || 1;
          const pct = Math.min(100, ((1 - remaining / total) * 100));
          bar.style.width = pct + '%';
        }
      }
      if (remaining <= 0) { clearInterval(id); }
    }, 1000);
    countdownTimers.push(id);
  });
}

function checkWatcherVisibility() {
  const cw = document.getElementById('construct-watcher');
  const mw = document.getElementById('march-watcher');
  const empty = document.getElementById('timers-empty');
  const cCount = document.querySelectorAll('#construct-list .watcher-item').length;
  const mCount = document.querySelectorAll('#march-list .watcher-item').length;
  if (cCount === 0) cw.style.display = 'none';
  if (mCount === 0) mw.style.display = 'none';
  if (cCount === 0 && mCount === 0) empty.style.display = 'block';
  else empty.style.display = 'none';
}

// ========== API CALL (generic) ==========
async function apiCall(endpoint, silent=false) {
  const start = performance.now();
  let url = PROXY + endpoint;
  if (!url.includes('deviceId=') && deviceId) url += (url.includes('?') ? '&' : '?') + 'deviceId=' + deviceId;
  if (!url.includes('idUser=') && userId) url += '&idUser=' + userId;
  if (!silent) {
    document.getElementById('resp-time').innerHTML = '<span class="spinner"></span> Cargando...';
  }
  try {
    const resp = await fetch(url);
    const data = await resp.json();
    const elapsed = data._proxy_elapsed_ms || Math.round(performance.now() - start);
    if (!silent) showResponse(data, elapsed, resp.status);
    addStatsEntry(endpoint.split('?')[0] + '?' + (endpoint.match(/action=(\w+)/)?.[1]||'?'), resp.status, elapsed, data);
    if (data.result === 1 && data.User) {
      lastUserData = data;
      renderDashboard(data);
    }
    return data;
  } catch (e) {
    if (!silent) document.getElementById('resp-time').innerHTML = `❌ ${e.message}`;
    return null;
  }
}

// ========== LOGIN ==========
async function doLogin() {
  deviceId = document.getElementById('deviceId').value;
  saveState();
  const r = await apiCall('USER?action=login');
  if (r && r.User) {
    userId = r.User._id?.$oid || r.User._id || '';
    saveState();
    renderDashboard(r);
    setStatus(`✅ Conectado: ${r.User.Player?.UserName || '?'} | idUser: ${userId}`, 'ok');
    document.getElementById('conn-status').textContent = '🟢';
    document.getElementById('conn-status').style.color = 'var(--green)';
    document.getElementById('dash-summary').innerHTML = `<span style="color:var(--green)">${r.User.Player?.UserName || '?'}</span>`;
  } else {
    setStatus('❌ Login falló', 'err');
  }
}

// ========== REFRESH ==========
async function refreshDashboard() {
  if (!userId) return doLogin();
  setStatus('🔄 Refrescando datos...');
  const r = await apiCall('USER?action=login');
  if (r && r.User) {
    renderDashboard(r);
    setStatus(`✅ Datos actualizados: ${r.User.Player?.UserName || '?'}`, 'ok');
  } else {
    setStatus('❌ Error al refrescar', 'err');
  }
}

// ========== STATUS ==========
function setStatus(msg, cls='') {
  document.getElementById('status-bar').innerHTML = `⚡ ${msg}`;
}

// ========== INIT ==========
// Auto-login if deviceId exists
if (deviceId) {
  setTimeout(doLogin, 500);
}
